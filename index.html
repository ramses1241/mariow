<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNES Classic - Super Mario World</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle, #25262b 0%, #0f1013 100%);
            color: #ffffff;
            font-family: 'Arial Black', Gadget, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        #info-bar {
            margin-bottom: 12px;
            font-size: 0.85rem;
            color: #a2a2d0;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        /* CUERPO PRINCIPAL DE LA CARCASA SNES */
        .snes-hardware {
            background-color: #cbd0df; /* Gris claro oficial SNES */
            border: 6px solid #adb2c4;
            border-radius: 24px;
            padding: 40px 20px 30px 20px;
            box-shadow: 
                inset 0 6px 0 #f0f2f7, 
                0 20px 40px rgba(0,0,0,0.8);
            position: relative;
            width: 95vw;
            max-width: 800px;
            height: 75vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* PANEL CENTRAL OSCURO (Donde se inserta el cartucho simulado) */
        .snes-cartridge-slot {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 65%;
            height: 30px;
            background-color: #9ea3b5;
            border-bottom: 4px solid #7d8194;
            border-radius: 0 0 16px 16px;
            box-shadow: inset 0 -3px 5px rgba(0,0,0,0.3);
        }

        /* INTERRUPTORES DE POWER Y RESET (Púrpura Clásico) */
        .snes-switch {
            position: absolute;
            top: -15px;
            width: 45px;
            height: 25px;
            background-color: #51448b; /* Morado SNES */
            border-radius: 6px 6px 0 0;
            box-shadow: 0 -3px 0 #3a3068, inset 0 2px 3px rgba(255,255,255,0.4);
        }
        .switch-power { left: 40px; }
        .switch-reset { right: 40px; background-color: #695da6; }

        /* ETIQUETAS DE TEXTO GRABADAS EN EL PLÁSTICO */
        .snes-label {
            position: absolute;
            font-size: 0.65rem;
            color: #51448b;
            font-weight: bold;
            text-transform: uppercase;
        }
        .label-power { top: 15px; left: 42px; }
        .label-reset { top: 15px; right: 42px; }

        /* RANURAS DE VENTILACIÓN TRASERAS */
        .snes-vents {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
        }
        .vent-line {
            width: 4px;
            height: 12px;
            background-color: #8c91a3;
            border-radius: 2px;
        }

        /* CONTENEDOR DE LA PANTALLA (Borde interior gris oscuro) */
        #game-container {
            width: 100%;
            height: 100%;
            background: #000;
            border: 12px solid #585a66; 
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
        }

        #game {
            width: 100%;
            height: 100%;
        }

        /* TEXTO INFERIOR: SUPER NINTENDO ENTERTAINMENT SYSTEM */
        .snes-brand {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #484a56;
            letter-spacing: 5px;
            text-align: center;
            font-style: italic;
            border-bottom: 2px solid #9ea3b5;
            padding-bottom: 4px;
            width: 80%;
        }

        /* CONFIGURACIÓN CROMÁTICA DE LOS BOTONES VIRTUALES */
        :root {
            --ejs-button-color: rgba(81, 68, 139, 0.65) !important; 
            --ejs-dpad-color: rgba(45, 46, 53, 0.8) !important;     
        }
    </style>
</head>
<body>

    <div id="info-bar">SÚPER NINTENDO CLOUD CONSOLE</div>
    
    <div class="snes-hardware">
        <div class="snes-switch switch-power"></div>
        <div class="snes-switch switch-reset"></div>
        <span class="snes-label label-power">Power</span>
        <span class="snes-label label-reset">Reset</span>
        
        <div class="snes-cartridge-slot"></div>
        
        <div class="snes-vents">
            <div class="vent-line"></div><div class="vent-line"></div><div class="vent-line"></div>
            <div class="vent-line"></div><div class="vent-line"></div><div class="vent-line"></div>
        </div>
        
        <!-- Pantalla del juego -->
        <div id="game-container">
            <div id="game"></div>
        </div>
        
        <div class="snes-brand">SUPER NINTENDO</div>
    </div>

    <script>
        const statusText = document.getElementById('info-bar');

        function initSnesCloud() {
            // Nombre exacto del archivo con los espacios codificados para la URL web
            const targetRom = "Super Mario World (USA).sfc";
            const romUrl = './' + encodeURIComponent(targetRom);

            statusText.innerText = "ENCENDIDO: SUPER MARIO WORLD";

            // Configuración técnica de EmulatorJS apuntando al archivo directo
            window.EJS_player = '#game';
            window.EJS_core = 'snes'; 
            window.EJS_gameUrl = romUrl; 
            window.EJS_pathtodata = 'https://emulatorjs.org'; 
            window.EJS_startOnLoaded = true;
            window.EJS_color = '#51448b'; 

            // Forzar el gamepad virtual nativo en pantalla
            window.EJS_VirtualGamepadSettings = {
                "show": true
            };

            // Inyección del cargador central de dependencias
            const script = document.createElement('script');
            script.src = 'https://emulatorjs.orgloader.js';
            document.body.appendChild(script);
        }

        initSnesCloud();
    </script>
</body>
</html>
